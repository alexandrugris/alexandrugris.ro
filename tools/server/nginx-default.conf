server {

	# SSL configuration
	#
	# listen 443 ssl default_server;
	# listen [::]:443 ssl default_server;
	#
	# Note: You should disable gzip for SSL traffic.
	# See: https://bugs.debian.org/773332
	#
	# Read up on ssl_ciphers to ensure a secure configuration.
	# See: https://bugs.debian.org/765782
	#
	# Self signed certs generated by the ssl-cert package
	# Don't use them in a production server!
	#
	# include snippets/snakeoil.conf;

	root /var/www/html;

	# Add index.php to the list if you are using PHP
	index index.html index.htm index.nginx-debian.html;
    server_name alexandrugris.ro blog.alexandrugris.ro www.alexandrugris.ro; # managed by Certbot

    # The default ETag leaks inode number and file size. Nothing here needs
    # revalidation-by-ETag; Last-Modified plus Cache-Control do the job.
    etag off;

    # www is a CNAME to the apex, so without this it serves a byte-identical
    # copy of every page under a second hostname. Send it home.
    if ($host = www.alexandrugris.ro) {
        return 301 https://alexandrugris.ro$request_uri;
    }

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ =404;
	}

	# Canonicalise directory index URLs: /foo/index.html -> /foo/
	# Match on $request_uri, never $uri. try_files $uri $uri/ re-dispatches a
	# directory request internally to /index.html; matching $uri would catch
	# that internal hop and 301 the client back to the URL it just asked for.
	# $request_uri keeps the original client request and is untouched by
	# internal redirects. The query string is carried across explicitly.
	if ($request_uri ~ "^/index\.html(\?.*)?$")   { return 301 /$is_args$args; }
	if ($request_uri ~ "^/(.+/)index\.html(\?.*)?$") { return 301 /$1$is_args$args; }

        location ~ \.(gif|jpg|png)$ {
                add_header Cache-Control "public, max-age=7257600";
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
                add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        }

# pass PHP scripts to FastCGI server
	#
	#location ~ \.php$ {
	#	include snippets/fastcgi-php.conf;
	#
	#	# With php-fpm (or other unix sockets):
	#	fastcgi_pass unix:/var/run/php/php7.0-fpm.sock;
	#	# With php-cgi (or other tcp sockets):
	#	fastcgi_pass 127.0.0.1:9000;
	#}

	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	#location ~ /\.ht {
	#	deny all;
	#}


    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alexandrugris.ro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alexandrugris.ro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot









}
server {
    if ($host = alexandrugris.ro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = blog.alexandrugris.ro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.alexandrugris.ro) {
        return 301 https://alexandrugris.ro$request_uri;
    } # managed by Certbot


	listen 80 ;
	listen [::]:80 ;
    server_name alexandrugris.ro blog.alexandrugris.ro www.alexandrugris.ro;
    return 404; # managed by Certbot






}

# Unknown SNI over TLS, added 2026-10-11. Without this block an unmatched SNI
# still reached the real vhost above, because that one had no default_server
# marker and simply won by being first.
#
# HTTP/2 is declared on the listen line, NOT with `http2 on;` -- that directive
# only exists from nginx 1.25.1 and this box runs 1.14.0, so using it would make
# nginx -t fail outright.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/alexandrugris.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexandrugris.ro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    return 444;
}
